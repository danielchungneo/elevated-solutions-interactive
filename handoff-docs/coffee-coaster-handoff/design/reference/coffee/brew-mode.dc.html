<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Espresso brew mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..800,0..100&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>
body{margin:0;background:#F5EDE0}
.paper{background-color:#F5EDE0;background-image:url(/textures/paper-grain.png);background-size:256px 256px}
h1,h2,h3,.serif{font-variation-settings:"SOFT" 100}
a{color:#974722}a:hover{color:#2B1D14}
button:focus-visible,a:focus-visible{outline:3px solid #A9532A;outline-offset:2px}
</style>
</helmet>
<div class="paper" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; color: #2B1D14; font-family: Nunito, ui-rounded, system-ui, sans-serif; display: flex; flex-direction: column">

<header style="height: 64px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
<a href="recipe-espresso.dc.html" aria-label="Exit brew mode" style="width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #2B1D14">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<div style="display: flex; flex-direction: column; align-items: center; line-height: 1.2">
<span style="font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 20px; font-variation-settings: 'SOFT' 100">Espresso</span>
<span style="font-size: 13px; font-weight: 700; color: #6B5242">Brew mode</span>
</div>
<button type="button" aria-label="Shot timer" aria-pressed="{{timerPressed}}" onClick="{{toggleTimer}}" style="{{timerBtnStyle}}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M10 2h4"></path></svg>
</button>
</header>

<div aria-hidden="true" style="padding: 0 20px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; flex-shrink: 0">
<sc-for list="{{segments}}" as="seg" hint-placeholder-count="6">
<span style="{{seg.style}}"></span>
</sc-for>
</div>

<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
<main aria-live="polite" style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 15px; font-weight: 800; color: #974722">Step {{stepNum}} of 6</span>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 38px; line-height: 1.1">{{step.title}}</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.5">{{step.body}}</p>
<sc-if value="{{step.hasTip}}" hint-placeholder-val="{{ false }}">
<p style="margin: 4px 0 0; padding: 14px 16px; background: #EFE4D3; border-radius: 16px; font-size: 19px; line-height: 1.5"><strong style="color: #974722">Tip · </strong>{{step.tip}}</p>
</sc-if>
</main>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<main style="flex: 1; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
<svg width="56" height="40" viewBox="0 0 40 28" fill="none" stroke="#A9532A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 26c-4-4 4-7 0-11s4-7 0-11"></path><path d="M20 26c-4-4 4-7 0-11s4-7 0-11"></path><path d="M28 26c-4-4 4-7 0-11s4-7 0-11"></path></svg>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 52px; line-height: 1">Enjoy.</h1>
<p style="margin: 0; font-size: 22px; line-height: 1.5">Sip it while the crema's still there. Too sour or too bitter? Adjust one thing on the next shot.</p>
</main>
</sc-if>

<sc-if value="{{showTimer}}" hint-placeholder-val="{{ true }}">
<section aria-label="Shot timer" style="margin: 0 16px 12px; padding: 16px 18px; background: #3A2A20; color: #F5EDE0; border-radius: 24px; box-shadow: 0 8px 22px rgba(43,29,20,0.2); display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column">
<span role="timer" aria-live="off" style="font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums">{{timeLabel}}</span>
<span aria-live="polite" style="font-size: 15px; font-weight: 700; color: {{statusColor}}">{{status}}</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Reset timer" onClick="{{reset}}" style="width: 48px; height: 48px; border-radius: 999px; border: 1.5px solid #8A715F; background: transparent; color: #F5EDE0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v4h4"></path></svg>
</button>
<button type="button" onClick="{{startStop}}" style="min-width: 96px; height: 56px; padding: 0 18px; border-radius: 999px; border: 0; background: #D89A5E; color: #2B1D14; font: 800 18px Nunito, system-ui, sans-serif; cursor: pointer">{{runLabel}}</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div aria-hidden="true" style="position: relative; height: 10px; border-radius: 999px; background: #4A382C; overflow: hidden">
<span style="position: absolute; left: 62.5%; width: 12.5%; top: 0; bottom: 0; background: #6E8063"></span>
<span style="{{fillStyle}}"></span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #E8C9A4"><span>0 s</span><span>Target 25–30 s</span><span>40 s</span></div>
</div>
</section>
</sc-if>

<nav aria-label="Step controls" style="padding: 12px 16px 28px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 12px; border-top: 1px solid #E0D3C0; background: rgba(245,237,224,0.96); flex-shrink: 0">
<button type="button" onClick="{{back}}" disabled="{{backDisabled}}" style="{{backStyle}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
Back</button>
<button type="button" onClick="{{next}}" style="height: 68px; border: 0; border-radius: 999px; background: #A9532A; color: #FCF7EE; font: 800 20px Nunito, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 6px 16px rgba(169,83,42,0.28)">{{nextLabel}}
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 3, done: false, timerOpen: null, running: false, elapsed: 0 };
  }
  componentWillUnmount() { clearInterval(this.iv); }
  start() {
    this.t0 = Date.now() - this.state.elapsed;
    clearInterval(this.iv);
    this.iv = setInterval(() => this.setState({ elapsed: Date.now() - this.t0 }), 100);
    this.setState({ running: true });
  }
  stop() { clearInterval(this.iv); this.setState({ running: false }); }
  renderVals() {
    const steps = [
      { title: 'Warm everything up', body: 'Run a blank shot through the empty portafilter and group head, and warm your cup with hot water. Cold metal and ceramic steal heat from the shot and make it taste sour and thin.', tip: 'Most machines need 15 to 30 minutes to fully heat up. Be patient.' },
      { title: 'Weigh and grind', body: 'Grind 18 g of coffee into the portafilter basket. Weighing instead of scooping keeps shots repeatable, and a fine grind gives the water enough resistance to extract properly under pressure.', tip: 'If you can, grind directly into the basket to avoid a mess and static.' },
      { title: 'Level and tamp', body: 'Gently level the grounds with your finger or a tap on the counter, then tamp straight down with firm, even pressure. The goal is a flat, level bed so water flows evenly through all of it, not just one channel.', tip: "Level matters more than force. Don't twist or hammer." },
      { title: 'Pull the shot', body: 'Lock in the portafilter, place your cup on a scale if you have one, and start the shot right away. Aim for roughly 25 to 30 seconds, with a steady flow that looks like warm honey.' },
      { title: 'Taste and adjust', body: 'Sour and sharp usually means under-extracted, so go finer or increase yield slightly. Harsh, bitter and drying means over-extracted, so go coarser. Change only one thing at a time.', tip: "Keep notes. It's normal to waste a few shots on a new bag." },
      { title: 'Serve immediately', body: 'Crema fades within a minute or two and espresso changes quickly as it cools. Serve and sip right away, or stir gently to blend the crema in first.' }
    ];
    const { i, done, running, elapsed, timerOpen } = this.state;
    const s = steps[i];
    const last = i === steps.length - 1;
    const showTimer = !done && (timerOpen === null ? i === 3 : timerOpen);
    const sec = elapsed / 1000;
    let status = 'Start with the shot', statusColor = '#E8C9A4';
    if (sec > 0 && sec < 25) { status = running ? 'Keep going…' : 'Paused'; }
    if (sec >= 25 && sec <= 30) { status = 'In the window. Stop the shot.'; statusColor = '#B9CBAA'; }
    if (sec > 30 && sec <= 35) { status = 'A little long'; statusColor = '#F2C38F'; }
    if (sec > 35) { status = 'Too long: grind coarser next time'; statusColor = '#F2C38F'; }
    const pct = Math.min(sec / 40, 1) * 100;
    const backDisabled = i === 0 && !done;
    const go = (patch) => { this.stop(); this.setState(Object.assign({ elapsed: 0, timerOpen: null }, patch)); };
    return {
      step: { title: s.title, body: s.body, tip: s.tip || '', hasTip: !!s.tip },
      stepNum: i + 1,
      segments: steps.map((_, k) => ({ style: 'display: block; height: 6px; border-radius: 999px; background: ' + (done || k <= i ? '#A9532A' : '#E0D3C0') + ';' })),
      done, notDone: !done, showTimer,
      timerPressed: showTimer ? 'true' : 'false',
      timerBtnStyle: 'width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 0; background: ' + (showTimer ? '#3A2A20' : '#EFE4D3') + '; color: ' + (showTimer ? '#F5EDE0' : '#2B1D14') + ';',
      toggleTimer: () => this.setState({ timerOpen: !showTimer }),
      timeLabel: sec.toFixed(1) + ' s',
      status, statusColor,
      runLabel: running ? 'Stop' : (sec > 0 ? 'Resume' : 'Start'),
      startStop: () => (running ? this.stop() : this.start()),
      reset: () => { this.stop(); this.setState({ elapsed: 0 }); },
      fillStyle: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + pct + '%; background: #D89A5E; border-radius: 999px; opacity: 0.9;',
      nextLabel: done ? 'Brew another' : (last ? 'Done' : 'Next step'),
      next: () => {
        if (done) go({ done: false, i: 0 });
        else if (last) go({ done: true });
        else go({ i: i + 1 });
      },
      back: () => {
        if (done) this.setState({ done: false });
        else if (i > 0) go({ i: i - 1 });
      },
      backDisabled,
      backStyle: 'height: 68px; border-radius: 999px; background: #FCF7EE; border: 1.5px solid ' + (backDisabled ? '#E0D3C0' : '#C9B8A6') + '; color: ' + (backDisabled ? '#A8988A' : '#2B1D14') + '; font: 800 17px Nunito, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: ' + (backDisabled ? 'default' : 'pointer') + ';'
    };
  }
}
</script>
</body>
</html>
